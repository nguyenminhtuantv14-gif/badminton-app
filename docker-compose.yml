version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: badminton_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: badminton_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: badminton_backend_container
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=badminton_db
      - DB_PORT=3306
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: badminton_frontend_container
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: